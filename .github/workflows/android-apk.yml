name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Add Android platform
        run: npx cap add android
      - name: Sync Capacitor plugins and original web app
        run: npx cap sync android
      - name: Install image tooling and apply custom app icon
        run: |
          python3 -m pip install pillow
          python3 scripts/apply-app-icon.py
      - name: Add exact alarm and location permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          permissions = [
              '<uses-permission android:name="android.permission.INTERNET"/>',
              '<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>',
              '<uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>',
              '<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>',
              '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>'
          ]
          start = s.index('<manifest')
          end = s.index('>', start) + 1
          for permission in permissions:
              if permission not in s:
                  s = s[:end] + chr(10) + '    ' + permission + s[end:]
                  end = s.index('>', s.index('<manifest')) + 1
          p.write_text(s)
          PY
      - name: Configure native media playback notification
        run: python3 scripts/setup-native-media.py
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: quran-alkareem-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
